server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "${JWT_SECRET}"
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG