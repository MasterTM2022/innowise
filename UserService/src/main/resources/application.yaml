server:
  port: 8081
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://user-postgres:5432/InnoUserDB
    username: postgres
    password: 070696
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
#      host: redis
#      port: 6379
  cache:
    type: redis
    redis:
      key-prefix: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri:
            ${AUTH_SERVICE_URL}/.well-known/jwks.json
  web:
    resources:
      add-mappings: true

app:
  jwt:
    secret: e38e01a12177a40fc49f833864b5423b29a039b127c284f10ac81c07933d4234c2749c01633de0efa45c14fb40cfc60a90b3b8b98108cd38dd3d10d4f666e314
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG