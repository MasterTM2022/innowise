name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  # Настройки Maven
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # Теги для Docker образов
  AUTH_SERVICE_IMAGE: ${{ github.repository }}/auth-service:${{ github.sha }}
  USER_SERVICE_IMAGE: ${{ github.repository }}/user-service:${{ github.sha }}
  ORDER_SERVICE_IMAGE: ${{ github.repository }}/order-service:${{ github.sha }}

jobs:
  # ==================== BUILD ====================
  build:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [common, AuthService, UserService, OrderService]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${matrix.service}
        run: |
          cd ${{ matrix.service == 'common' && 'common' || matrix.service }}
          mvn clean compile -DskipTests

  # ==================== TEST ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [common, AuthService, UserService, OrderService]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Redis (for integration tests)
        run: |
          sudo docker run -d --name redis-test -p 6379:6379 redis:7-alpine
          sleep 5

      - name: Run tests for ${matrix.service}
        run: |
          cd ${{ matrix.service == 'common' && 'common' || matrix.service }}
          mvn test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service == 'common' && 'common' || matrix.service }}/target/surefire-reports/

  # ==================== CODE ANALYSIS (optional) ====================
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify with coverage
        run: mvn verify -Pjacoco -DskipTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # ==================== BUILD DOCKER IMAGES ====================
  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build, test]
    strategy:
      matrix:
        service:
          - { name: "auth-service", dir: "AuthService", port: "8080" }
          - { name: "user-service", dir: "UserService", port: "8081" }
          - { name: "order-service", dir: "OrderService", port: "8082" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service.name }}
        run: |
          cd ${{ matrix.service.dir }}
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.dir }}
          file: ${{ matrix.service.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:latest

      - name: Verify image
        run: |
          docker pull ghcr.io/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}