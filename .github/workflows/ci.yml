name: CI Pipeline

on:
  push:
    branches: [ main, dev, week5 ]
  pull_request:
    branches: [ main, dev, week5 ]

env:
  # Настройки Maven
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # Теги для Docker образов
  AUTH_SERVICE_IMAGE: ghcr.io/mastertm2022/innowise/auth-service:${{ github.sha }}
  USER_SERVICE_IMAGE: ghcr.io/mastertm2022/innowise/user-service:${{ github.sha }}
  ORDER_SERVICE_IMAGE: ghcr.io/mastertm2022/innowise/order-service:${{ github.sha }}

jobs:
  # ==================== BUILD ====================
  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean compile -DskipTests

  # ==================== TEST ====================
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn test
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

  # ==================== CODE ANALYSIS (optional) ====================
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven verify with coverage
        run: mvn verify -Pjacoco -DskipTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # ==================== BUILD DOCKER IMAGES ====================
  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: AuthService
          file: AuthService/Dockerfile
          push: true
          tags: ghcr.io/mastertm2022/innowise/auth-service:${{ github.sha }}

      - name: Build and push User Service
        uses: docker/build-push-action@v6
        with:
          context: UserService
          file: UserService/Dockerfile
          push: true
          tags: ghcr.io/mastertm2022/innowise/user-service:${{ github.sha }}

      - name: Build and push Order Service
        uses: docker/build-push-action@v6
        with:
          context: OrderService
          file: OrderService/Dockerfile
          push: true
          tags: ghcr.io/mastertm2022/innowise/order-service:${{ github.sha }}